[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analyze-speech"
version = "0.1.0"
description = "Local transcript and recording analysis for personal speech research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pitch = ["librosa>=0.10.2,<0.12", "numpy>=1.24,<3"]

[project.scripts]
analyze-speech = "audio_analysis:main"

[tool.setuptools]
py-modules = ["audio_analysis"]
